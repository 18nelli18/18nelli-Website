<!DOCTYPE html>
<!--
  =====================================================================
  musique.html — lecteur MP3 + visualiseur
  ---------------------------------------------------------------------
  Styles  : assets/css/pages/musique.css  (chargé EN DERNIER, il doit
            surcharger styles.css et Bootstrap : fond, typographie)
  Script  : assets/js/mp3-player.js
  Données : data/songs.json  ->  assets/media/song/*.mp3
  =====================================================================
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
    />
    <title>ECOUTE ECOUTE JAI FAIT UN TRUC</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Comic+Neue&amp;display=swap"
    />

    <!-- L'ordre ci-dessous est significatif : chaque feuille peut
         surcharger la précédente. -->
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/pages/musique.css" />
  </head>

  <body>
    <!-- ============================================================
         Lecteur
         ============================================================ -->
    <div id="mp3-player">
      <h2>ECOUTE EN BOUCLE</h2>

      <!-- Rempli dynamiquement depuis data/songs.json -->
      <ul id="playlist"></ul>

      <div id="controls">
        <button id="prev" class="btn btn-secondary">◄◄</button>
        <button id="play" class="btn btn-primary">Play ▶</button>
        <button id="next" class="btn btn-secondary">►►</button>
      </div>

      <!-- Spectre audio dessiné via la Web Audio API -->
      <canvas id="visualizer"></canvas>
    </div>

    <!-- ============================================================
         Navigation et décor
         ============================================================ -->
    <a href="javascript:history.back()" class="house-link">
      <img src="assets/img/retour.png" alt="Retour" class="house-icon" />
    </a>

    <img
      class="camera-gif"
      src="assets/img/musiqu.gif"
      width="800"
      height="435"
      style="filter: brightness(100%) contrast(200%) hue-rotate(0deg) saturate(0%)"
    />

    <script src="assets/js/mp3-player.js"></script>
  </body>
</html>
