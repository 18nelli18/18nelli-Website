<!DOCTYPE html>
<!--
  =====================================================================
  prediction.html — faux chatbot rétro
  ---------------------------------------------------------------------
  Page autonome : elle ne charge ni Bootstrap ni assets/css/styles.css.

  Styles : assets/css/pages/prediction.css
  Script : assets/js/prediction.js
  =====================================================================
-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TU VEUX SAVOIR???? BAH POSE TA QUESTION</title>
    <link rel="stylesheet" href="assets/css/pages/prediction.css" />
  </head>

  <!-- splash-lock : bloque le scroll tant que l'intro est affichée.
       La classe est retirée par prediction.js à la fin du fondu. -->
  <body class="splash-lock">
    <!-- ============================================================
         Écran d'intro
         ============================================================ -->
    <div id="prediction-screen">
      <img src="./assets/img/prediction.png" alt="Prédiction" />
    </div>

    <!-- ============================================================
         Fenêtre principale
         ============================================================ -->
    <div class="chrome" role="application" aria-label="Chatbot rétro">
      <div class="titlebar" aria-hidden="true">
        <div class="brand">
          <div class="logo" aria-hidden="true"></div>
          <div class="name">PREDICT-BOX // v0.9b</div>
        </div>
        <!-- Diodes décoratives : seule POWER est allumée -->
        <div class="lights">
          <div class="led on" title="POWER"></div>
          <div class="led" title="NET"></div>
          <div class="led" title="SYNC"></div>
        </div>
      </div>

      <div class="chat">
        <!-- Les bulles sont ajoutées par prediction.js -->
        <div
          id="messages"
          class="messages"
          aria-live="polite"
          aria-label="Historique de la conversation"
        >
          <div class="bubble bot">
            Bienvenue. Posez votre question.
            <span class="meta">bot • prêt</span>
          </div>
        </div>

        <form id="composer" class="composer" autocomplete="off">
          <div class="input" aria-label="Zone de saisie">
            <input
              id="text"
              type="text"
              name="q"
              placeholder="Écris ici ta question…"
              aria-label="Écrire un message"
            />
          </div>
          <button class="btn" type="submit" aria-label="Envoyer">
            Envoyer
          </button>
        </form>
      </div>
    </div>

    <!-- ============================================================
         Barre d'état décorative
         ============================================================ -->
    <div class="status" aria-hidden="true">
      <span>État&nbsp;: CONNECTÉ</span><span class="sep">|</span>
      <span>Mode&nbsp;: NOIR &amp; BLANC</span><span class="sep">|</span>
      <div class="meter" title="Barre rétro purement décorative"></div>
    </div>

    <script src="assets/js/prediction.js"></script>
  </body>
</html>
