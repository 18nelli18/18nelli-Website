<!DOCTYPE html>
<!--
  =====================================================================
  index.html — page d'accueil
  ---------------------------------------------------------------------
  Structure de la page :
    1. Bandeau rouge défilant (.marquee)
    2. Cadre central + vignette vers prediction.html (.image-container)
    3. Bloc de liens vers les sections du site
    4. Décor : aigle, GIF, webcam, logo DVD rebondissant
    5. Lecteur CD façon Windows 95 (.cd-player), déplaçable à la souris

  Styles  : assets/css/styles.css  -> base + layout + pages/home.css
  Scripts : assets/js/{mobile-redirect,camera,dvd-bounce,draggable,cd-player}.js
            draggable.js doit rester AVANT cd-player.js
  =====================================================================
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
    />
    <title>Portfolio</title>

    <!-- Polices Google : Iceland (lecteur CD) et Comic Neue (textes) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Iceland&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Comic+Neue&amp;display=swap"
    />

    <!-- Feuilles de style : tierces puis les nôtres -->
    <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/vendor/animate.min.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />

    <!-- Sans `defer` : doit s'exécuter au plus tôt pour éviter le flash
         de la version desktop sur mobile. -->
    <script src="assets/js/mobile-redirect.js"></script>
  </head>

  <body
    style="
      background: url('assets/img/dmontag.png') center / contain, rgb(0, 0, 0);
    "
  >
    <!-- ============================================================
         1. Bandeau défilant
         ============================================================ -->
    <h1 class="marquee">
      <span style="color: rgb(255, 0, 0)">SITE</span>&nbsp;<span
        style="color: rgb(255, 0, 0)"
        >DETENU DESIGNER ET ACUALISER PAR 18NELLI - CORBEILLE EN
        LIGNE- ARCHIVES - MUSIQUES - PHOTO -&nbsp; PROJET - VIDEO&nbsp; </span
      >
    </h1>

    <!-- ============================================================
         2. Cadre central + accès à la page "prédiction"
         ============================================================ -->
    <div class="image-container">
      <img class="tada animated" src="assets/img/qskldq.png" alt="qskldq" />

      <!-- Vignette cliquable posée en bas du cadre -->
      <a href="prediction.html" class="bottom-clickable">
        <img src="./assets/img/prediction.png" alt="Prediction" />
      </a>
    </div>

    <!-- ============================================================
         3. Menu principal
         ---------------------------------------------------------
         Bloc positionné et filtré à la main. Les valeurs en pixels
         sont volontaires : le rendu est calé pour un grand écran,
         les visiteurs mobiles partent sur mobile.html.
         ============================================================ -->
    <div
      style="
        top: 100px;
        left: 150px;
        right: 10px;
        bottom: 100px;
        position: absolute;
        transform: translate(63px);
        filter: blur(0px) contrast(200%) grayscale(60%) hue-rotate(360deg)
          invert(0%) saturate(200%);
        backdrop-filter: brightness(157%) hue-rotate(19deg) invert(100%);
        -webkit-backdrop-filter: brightness(157%) hue-rotate(19deg) invert(100%);
        margin: 165px;
        width: 603px;
        height: 343px;
      "
    >
      <p
        style="
          color: var(--bs-body-bg);
          font-family: 'Comic Neue', serif;
          font-weight: bold;
          font-size: 48px;
          background: rgb(255, 0, 0);
          height: 39px;
          padding: 9px;
          margin: 5px;
          width: 674px;
          text-shadow: 6px 0px 3px #ff0000, -5px -5px 5px var(--bs-black);
          transform: translate(-39px) rotate(0deg) scale(1.06) skew(0deg);
          filter: grayscale(0%);
        "
      >
        liens pour accede aux trucs:
        <br /><a href="photo.html">· Photos !!!</a>
        <br /><a href="projets.html">· Trucs !!!</a>
        <br /><a href="musique.html">· MusiQue !!!</a>
        <br /><a href="blog.html">· Blog !!!</a>
      </p>

      <!-- GIF décoratif désaturé, en fond du menu -->
      <img
        src="assets/img/tenor-3089517422.gif"
        width="198"
        height="468"
        style="
          filter: blur(0px) brightness(200%) contrast(200%) grayscale(100%)
            hue-rotate(360deg);
          opacity: 0.48;
        "
      />
    </div>

    <!-- ============================================================
         4. Décor
         ============================================================ -->

    <!-- Aigle inversé en bas à droite -->
    <img
      class="aigle"
      src="assets/img/1417768-1345806767.gif"
      width="379"
      height="425"
      style="
        filter: brightness(200%) contrast(200%) grayscale(100%) hue-rotate(0deg)
          invert(100%) saturate(200%);
        opacity: 0.41;
      "
    />

    <!-- Flux webcam en direct (assets/js/camera.js) -->
    <div class="camera-zone">
      <video id="camera" autoplay playsinline></video>
    </div>

    <!-- Logo DVD rebondissant (assets/js/dvd-bounce.js) -->
    <img id="dvdLogo" src="assets/img/dvd-logo.png" alt="DVD" />

    <!-- ============================================================
         5. Lecteur CD (assets/js/cd-player.js)
         ---------------------------------------------------------
         Les boutons ⏮ et ⏭ encadrent ▶/⏸ ; seul ⏭ est actif
         (tire un morceau au hasard), ⏮ reste décoratif.

         Se déplace en tirant sur la barre de titre "CD Player".
         ============================================================ -->
    <div class="cd-player">
      <div class="title-bar">
        CD Player <span class="win-controls">_ ◻ ✕</span>
      </div>
      <div class="screen">[00] 00:00</div>
      <div class="controls">
        <button class="btn">⏮</button>
        <button id="playBtn" class="btn">▶</button>
        <button id="pauseBtn" class="btn">⏸</button>
        <button class="btn">⏭</button>
      </div>
      <div class="info">
        <div><strong>Artist:</strong> <span id="artist">18nelli</span></div>
        <div><strong>Title:</strong> <span id="title">Track 01</span></div>
      </div>
      <!-- Source de repli, remplacée au chargement par un morceau aléatoire -->
      <audio id="audio" src="assets/media/audio/drum elektron.wav"></audio>
    </div>

    <!-- ============================================================
         Scripts
         ============================================================ -->
    <script src="assets/vendor/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/camera.js"></script>
    <script src="assets/js/dvd-bounce.js"></script>
    <script src="assets/js/draggable.js"></script>
    <script src="assets/js/cd-player.js"></script>
  </body>
</html>
